name: cPanel transport and provider contracts
'on':
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  https-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, dom, mbstring, pdo_sqlite, simplexml, sodium, xml, xmlwriter, zip
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: composer install --no-interaction --prefer-dist
      - run: python -m pip install -r tests/Support/backup-protocol-requirements.txt
      - name: Real loopback HTTPS and provider regressions
        run: php vendor/phpunit/phpunit/phpunit tests/Integration/Providers/CpanelTransportTest.php tests/Unit/Providers tests/Unit/Provisioning --colors=never
  native-provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: colezahost-ci-test-only
          MARIADB_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, mbstring, pdo_mysql, simplexml, sodium, xml, xmlwriter, zip
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Real MariaDB provider probe and secret/schema regressions
        env:
          COLEZA_TEST_MARIADB_DSN: 'mysql:host=127.0.0.1;port=3306;charset=utf8mb4'
          COLEZA_TEST_MARIADB_USER: root
          COLEZA_TEST_MARIADB_PASSWORD: colezahost-ci-test-only
        run: >-
          php vendor/phpunit/phpunit/phpunit -c phpunit-mariadb.xml
          --filter '(ProvisioningProbeSafetyTest|ProviderVaultSchemaTest|ProvisioningSecretTest)'
          --colors=never
